<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 900" role="img"
           aria-label="Diagrama de conexionado: el micrófono INMP441 a la izquierda del ESP32-S3 Zero, el amplificador MAX98357A y el altavoz de 8 ohmios a la derecha, y el botón KY-004 abajo. Los tres módulos se alimentan desde los rieles comunes de 5 voltios, 3.3 voltios y masa.">
        <style>
    svg {
      color:#16202b;
      --f-surface:#ffffff; --f-surface2:#e9edf1;
      --c5v:#c14a34; --c3v3:#c2841a; --cgnd:#5b6874; --ci2s:#1b7cb5; --cctl:#2d8a62;
    }
    @media (prefers-color-scheme: dark) {
    svg {
      color:#e7edf3;
      --f-surface:#1a2128; --f-surface2:#222b33;
      --c5v:#ef7f66; --c3v3:#eeb24f; --cgnd:#94a2af; --ci2s:#57b2e8; --cctl:#5cc394;
    }
    }
    svg { background: var(--f-surface); }
    .f-surface{fill:var(--f-surface)} .f-surface2{fill:var(--f-surface2)}
    .f-5v{fill:var(--c5v)} .f-3v3{fill:var(--c3v3)} .f-gnd{fill:var(--cgnd)}
    .s-5v{stroke:var(--c5v)} .s-3v3{stroke:var(--c3v3)} .s-gnd{stroke:var(--cgnd)}
    .s-i2s{stroke:var(--ci2s)} .s-ctl{stroke:var(--cctl)}
    #a-i2s path{fill:var(--ci2s)} #a-ctl path{fill:var(--cctl)}
    text{font-family:"IBM Plex Mono","DejaVu Sans Mono",monospace}
  </style>
        <defs>
          <marker id="a-i2s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,1 L10,5 L0,9 z"/>
          </marker>
          <marker id="a-ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,1 L10,5 L0,9 z"/>
          </marker>
        </defs>

        <!-- ============ RIELES ============ -->
        <g stroke-width="3" stroke-linecap="round">
          <line x1="86" y1="600" x2="972" y2="600" class="s-5v"/>
          <line x1="86" y1="650" x2="972" y2="650" class="s-3v3"/>
          <line x1="86" y1="700" x2="972" y2="700" class="s-gnd"/>
        </g>
        <g font-family="IBM Plex Mono, monospace" font-size="12" font-weight="600" text-anchor="end">
          <text x="76" y="604" class="f-5v">5V</text>
          <text x="76" y="654" class="f-3v3">3V3</text>
          <text x="76" y="704" class="f-gnd">GND</text>
        </g>
        <text x="972" y="726" font-family="IBM Plex Mono, monospace" font-size="10.5"
              fill="currentColor" opacity=".5" text-anchor="end">rieles comunes de la protoboard</text>

        <!-- ============ ESP32-S3 ZERO ============ -->
        <rect x="492" y="86" width="66" height="14" rx="4" class="f-surface2" stroke="currentColor" stroke-opacity=".35"/>
        <text x="525" y="78" font-family="IBM Plex Mono, monospace" font-size="10" fill="currentColor"
              opacity=".55" text-anchor="middle">USB-C · 5 V in</text>
        <rect x="410" y="100" width="220" height="420" rx="10" class="f-surface2"
              stroke="currentColor" stroke-opacity=".55" stroke-width="1.5"/>
        <text x="520" y="136" font-family="IBM Plex Sans Condensed, sans-serif" font-size="19"
              font-weight="700" fill="currentColor" text-anchor="middle">ESP32-S3 Zero</text>
        <text x="450" y="154" font-family="IBM Plex Sans, sans-serif" font-size="11"
              fill="currentColor" opacity=".6">Waveshare · ESP32-S3FH4R2</text>
        <circle cx="452" cy="186" r="7" fill="none" stroke="currentColor" stroke-opacity=".5"/>
        <circle cx="452" cy="186" r="3" fill="currentColor" fill-opacity=".35"/>
        <text x="466" y="190" font-family="IBM Plex Mono, monospace" font-size="10"
              fill="currentColor" opacity=".6">WS2812 · GPIO21</text>

        <g>
          <rect x="398" y="221" width="24" height="18" rx="2" class="f-surface" stroke="currentColor" stroke-opacity=".45"/>
          <rect x="398" y="265" width="24" height="18" rx="2" class="f-surface" stroke="currentColor" stroke-opacity=".45"/>
          <rect x="398" y="309" width="24" height="18" rx="2" class="f-surface" stroke="currentColor" stroke-opacity=".45"/>
          <rect x="398" y="451" width="24" height="18" rx="2" class="f-surface" stroke="currentColor" stroke-opacity=".45"/>
        </g>
        <g font-family="IBM Plex Mono, monospace" font-size="12" fill="currentColor">
          <text x="432" y="234">GPIO1</text>
          <text x="432" y="278">GPIO4</text>
          <text x="432" y="322">GPIO8</text>
          <text x="432" y="464">GPIO2</text>
        </g>
        <g>
          <rect x="618" y="221" width="24" height="18" rx="2" class="f-surface" stroke="currentColor" stroke-opacity=".45"/>
          <rect x="618" y="265" width="24" height="18" rx="2" class="f-surface" stroke="currentColor" stroke-opacity=".45"/>
          <rect x="618" y="309" width="24" height="18" rx="2" class="f-surface" stroke="currentColor" stroke-opacity=".45"/>
          <rect x="618" y="353" width="24" height="18" rx="2" class="f-surface" stroke="currentColor" stroke-opacity=".45"/>
        </g>
        <g font-family="IBM Plex Mono, monospace" font-size="12" fill="currentColor" text-anchor="end">
          <text x="608" y="234">GPIO5</text>
          <text x="608" y="278">GPIO6</text>
          <text x="608" y="322">GPIO7</text>
          <text x="608" y="366">GPIO10</text>
        </g>
        <g>
          <rect x="446" y="511" width="18" height="18" rx="2" class="f-surface" stroke="currentColor" stroke-opacity=".45"/>
          <rect x="496" y="511" width="18" height="18" rx="2" class="f-surface" stroke="currentColor" stroke-opacity=".45"/>
          <rect x="546" y="511" width="18" height="18" rx="2" class="f-surface" stroke="currentColor" stroke-opacity=".45"/>
        </g>
        <g font-family="IBM Plex Mono, monospace" font-size="10.5" fill="currentColor" opacity=".75">
          <text x="461" y="548">5V</text>
          <text x="511" y="548">3V3</text>
          <text x="561" y="548">GND</text>
        </g>
        <g stroke-width="2" fill="none">
          <line x1="455" y1="529" x2="455" y2="600" class="s-5v"/>
          <line x1="505" y1="529" x2="505" y2="650" class="s-3v3"/>
          <line x1="555" y1="529" x2="555" y2="700" class="s-gnd"/>
        </g>
        <circle cx="455" cy="600" r="4" class="f-5v"/>
        <circle cx="505" cy="650" r="4" class="f-3v3"/>
        <circle cx="555" cy="700" r="4" class="f-gnd"/>

        <!-- ============ INMP441 ============ -->
        <rect x="110" y="160" width="200" height="200" rx="8" class="f-surface"
              stroke="currentColor" stroke-opacity=".5" stroke-width="1.5"/>
        <text x="128" y="192" font-family="IBM Plex Sans Condensed, sans-serif" font-size="18"
              font-weight="700" fill="currentColor">INMP441</text>
        <text x="128" y="210" font-family="IBM Plex Sans, sans-serif" font-size="11"
              fill="currentColor" opacity=".6">Micrófono I2S MEMS · 3.3 V</text>
        <g font-family="IBM Plex Mono, monospace" font-size="12" fill="currentColor" text-anchor="end">
          <text x="300" y="234">SCK</text>
          <text x="300" y="278">WS</text>
          <text x="300" y="322">SD</text>
        </g>
        <g font-family="IBM Plex Mono, monospace" font-size="10.5" fill="currentColor" opacity=".75">
          <text x="156" y="382">VDD</text>
          <text x="206" y="382">GND</text>
          <text x="256" y="382">L/R</text>
        </g>
        <g stroke-width="2" fill="none">
          <line x1="150" y1="360" x2="150" y2="650" class="s-3v3"/>
          <line x1="200" y1="360" x2="200" y2="700" class="s-gnd"/>
          <line x1="250" y1="360" x2="250" y2="700" class="s-gnd"/>
        </g>
        <circle cx="150" cy="650" r="4" class="f-3v3"/>
        <circle cx="200" cy="700" r="4" class="f-gnd"/>
        <circle cx="250" cy="700" r="4" class="f-gnd"/>
        <g stroke-width="2" fill="none" class="s-i2s">
          <line x1="398" y1="230" x2="312" y2="230" marker-end="url(#a-i2s)"/>
          <line x1="398" y1="274" x2="312" y2="274" marker-end="url(#a-i2s)"/>
          <line x1="312" y1="318" x2="398" y2="318" marker-end="url(#a-i2s)"/>
        </g>

        <!-- ============ MAX98357A ============ -->
        <rect x="740" y="160" width="200" height="240" rx="8" class="f-surface"
              stroke="currentColor" stroke-opacity=".5" stroke-width="1.5"/>
        <text x="758" y="192" font-family="IBM Plex Sans Condensed, sans-serif" font-size="18"
              font-weight="700" fill="currentColor">MAX98357A</text>
        <text x="758" y="210" font-family="IBM Plex Sans, sans-serif" font-size="11"
              fill="currentColor" opacity=".6">Amplificador I2S clase D · 5 V</text>
        <g font-family="IBM Plex Mono, monospace" font-size="12" fill="currentColor">
          <text x="752" y="234">LRC</text>
          <text x="752" y="278">BCLK</text>
          <text x="752" y="322">DIN</text>
          <text x="752" y="366">SD</text>
        </g>
        <g stroke-width="2" fill="none" class="s-i2s">
          <line x1="642" y1="230" x2="728" y2="230" marker-end="url(#a-i2s)"/>
          <line x1="642" y1="274" x2="728" y2="274" marker-end="url(#a-i2s)"/>
          <line x1="642" y1="318" x2="728" y2="318" marker-end="url(#a-i2s)"/>
        </g>
        <line x1="642" y1="362" x2="728" y2="362" class="s-ctl" stroke-width="2" marker-end="url(#a-ctl)"/>
        <line x1="840" y1="400" x2="840" y2="428" stroke="currentColor" stroke-opacity=".45"
              stroke-width="1.5" stroke-dasharray="3 3"/>
        <circle cx="840" cy="432" r="4" fill="none" stroke="currentColor" stroke-opacity=".45" stroke-width="1.5"/>
        <text x="809" y="452" font-family="IBM Plex Mono, monospace" font-size="10.5"
              fill="currentColor" opacity=".6">GAIN libre</text>
        <g font-family="IBM Plex Mono, monospace" font-size="10.5" fill="currentColor" opacity=".75">
          <text x="908" y="420">Vin</text>
          <text x="938" y="450">GND</text>
        </g>
        <g stroke-width="2" fill="none">
          <line x1="900" y1="400" x2="900" y2="600" class="s-5v"/>
          <line x1="930" y1="400" x2="930" y2="700" class="s-gnd"/>
        </g>
        <circle cx="900" cy="600" r="4" class="f-5v"/>
        <circle cx="930" cy="700" r="4" class="f-gnd"/>

        <!-- ============ ALTAVOZ ============ -->
        <g stroke="currentColor" stroke-opacity=".55" stroke-width="2" fill="none">
          <line x1="772" y1="400" x2="772" y2="462"/>
          <line x1="812" y1="400" x2="812" y2="462"/>
        </g>
        <text x="762" y="422" font-family="IBM Plex Mono, monospace" font-size="11"
              fill="currentColor" opacity=".75">+</text>
        <text x="818" y="422" font-family="IBM Plex Mono, monospace" font-size="11"
              fill="currentColor" opacity=".75">−</text>
        <rect x="716" y="462" width="152" height="96" rx="8" class="f-surface"
              stroke="currentColor" stroke-opacity=".5" stroke-width="1.5"/>
        <path d="M738 498 L752 498 L768 484 L768 536 L752 522 L738 522 z" fill="currentColor" fill-opacity=".28"
              stroke="currentColor" stroke-opacity=".5" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M782 498 a10 10 0 0 1 0 24" fill="none" stroke="currentColor" stroke-opacity=".45" stroke-width="1.5"/>
        <path d="M792 490 a20 20 0 0 1 0 40" fill="none" stroke="currentColor" stroke-opacity=".3" stroke-width="1.5"/>
        <text x="854" y="506" font-family="IBM Plex Sans Condensed, sans-serif" font-size="15"
              font-weight="700" fill="currentColor" text-anchor="end">Altavoz</text>
        <text x="854" y="524" font-family="IBM Plex Mono, monospace" font-size="12"
              fill="currentColor" opacity=".7" text-anchor="end">8 Ω</text>

        <!-- ============ KY-004 (bajo los rieles) ============ -->
        <rect x="110" y="752" width="200" height="120" rx="8" class="f-surface"
              stroke="currentColor" stroke-opacity=".5" stroke-width="1.5"/>
        <text x="128" y="792" font-family="IBM Plex Sans Condensed, sans-serif" font-size="18"
              font-weight="700" fill="currentColor">KY-004</text>
        <text x="128" y="810" font-family="IBM Plex Sans, sans-serif" font-size="11"
              fill="currentColor" opacity=".6">Botón · pull-up integrado</text>
        <text x="300" y="844" font-family="IBM Plex Mono, monospace" font-size="12"
              fill="currentColor" text-anchor="end">OUT</text>
        <g font-family="IBM Plex Mono, monospace" font-size="10.5" fill="currentColor" opacity=".75">
          <text x="158" y="744">VCC</text>
          <text x="208" y="744">GND</text>
        </g>
        <g stroke-width="2" fill="none">
          <line x1="150" y1="752" x2="150" y2="650" class="s-3v3"/>
          <line x1="200" y1="752" x2="200" y2="700" class="s-gnd"/>
        </g>
        <circle cx="150" cy="650" r="4" class="f-3v3"/>
        <circle cx="200" cy="700" r="4" class="f-gnd"/>
        <polyline points="312,840 370,840 370,460 396,460" fill="none" class="s-ctl"
                  stroke-width="2" stroke-linejoin="round" marker-end="url(#a-ctl)"/>
      </svg>
