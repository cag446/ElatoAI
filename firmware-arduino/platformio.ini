; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ---------------------------------------------------------------------------
; Target board: Waveshare ESP32-S3-Zero (ESP32-S3FH4R2)
;   - 4MB QSPI Flash, 2MB QSPI PSRAM
;   - On-board WS2812 RGB LED on GPIO21
;   - BOOT button on GPIO0, native USB-C only (no UART bridge)
; ---------------------------------------------------------------------------
[env:esp32-s3-zero]
platform = espressif32 @ 6.10.0
board = esp32-s3-devkitc-1   ; generic S3 base; flash/psram overridden below for the Zero
framework = arduino
monitor_speed = 115200

lib_deps =
    bblanchon/ArduinoJson@^7.1.0
    links2004/WebSockets@^2.4.1
    ESP32Async/ESPAsyncWebServer@^3.7.6
    adafruit/Adafruit NeoPixel@^1.12.3
    https://github.com/esp-arduino-libs/ESP32_Button.git#v0.0.1
    https://github.com/pschatzmann/arduino-audio-tools.git#v1.0.1
    https://github.com/pschatzmann/arduino-libopus.git#a1.1.0

; --- Flash for the FH4R2 (4MB). Memory type / flash mode left at board default
; (the original project kept them commented). Forcing memory_type=qio_qspi broke
; the I2S output driver install -> crash in i2s_write. PSRAM is not used. ---
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.filesystem = spiffs
board_build.partitions = partition.csv

upload_protocol = esptool
upload_flags = --no-stub
monitor_filters =
  esp32_exception_decoder
  time
build_unflags = -std=gnu++11

build_flags =
    -std=gnu++17
    -D CORE_DEBUG_LEVEL=5
    -D DEBUG_ESP_PORT=Serial
    -D TOUCH_SENSOR_ENABLE=1        ; Enable touch sensor driver
    ; NOTE: BOARD_HAS_PSRAM intentionally NOT defined. This firmware does not use
    ; PSRAM ("No PSRAM Required") and enabling it routed I2S DMA buffers into PSRAM,
    ; causing a LoadProhibited crash in i2s_write when playing audio on the Zero.
    -D ARDUINO_USB_MODE=1          ; native USB (the Zero has no UART bridge)
    -D ARDUINO_USB_CDC_ON_BOOT=1   ; expose Serial over USB-C for the monitor
