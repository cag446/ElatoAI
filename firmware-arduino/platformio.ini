; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ---------------------------------------------------------------------------
; Target board: Waveshare ESP32-S3-Zero (ESP32-S3FH4R2)
;   - 4MB QSPI Flash, 2MB QSPI PSRAM
;   - On-board WS2812 RGB LED on GPIO21
;   - BOOT button on GPIO0, native USB-C only (no UART bridge)
; ---------------------------------------------------------------------------
[env:esp32-s3-zero]
platform = espressif32 @ 6.10.0
board = esp32-s3-devkitc-1   ; generic S3 base; flash/psram overridden below for the Zero
framework = arduino
monitor_speed = 115200

lib_deps =
    bblanchon/ArduinoJson@^7.1.0
    links2004/WebSockets@^2.4.1
    ESP32Async/ESPAsyncWebServer@^3.7.6
    adafruit/Adafruit NeoPixel@^1.12.3
    https://github.com/esp-arduino-libs/ESP32_Button.git#v0.0.1
    https://github.com/pschatzmann/arduino-audio-tools.git#v1.0.1
    https://github.com/pschatzmann/arduino-libopus.git#a1.1.0
    ; AEC para el barge-in por voz (Fase C). ACTIVO (Aec.h: AEC_ENABLED=1).
    ; Config final: AEC_FRAME=64 / AEC_FILTER=512 -> segun el modelo de Aec.h,
    ; ~32 KB del AEC + ~13 KB del supresor de residuo. (Los "48 KB" medidos que
    ; figuran en notas viejas eran con frame=128/filter=1024.) El intento inicial
    ; con frame=256/filter=2048 reservaba 92 KB y dejaba sin heap al
    ; decodificador Opus (crash en silk_decode_frame); ver Aec.h para el
    ; modelo de memoria de speex y el guardarrail OPUS_SCRATCH_BYTES.
    rjsachse/ESP32-SpeexDSP@^1.0.0

; --- Flash del FH4R2: 4 MB QSPI, y 2 MB de PSRAM QSPI DENTRO del chip.
; La PSRAM EXISTE pero esta DESACTIVADA (no se define BOARD_HAS_PSRAM, ver
; build_flags). Memory type / flash mode quedan en el default de la placa.
;
; Por que esta desactivada: el commit f02116b (2026-07-18) revirtio TRES cambios
; juntos -- board_build.flash_mode=qio, board_build.arduino.memory_type=qio_qspi
; y -D BOARD_HAS_PSRAM -- despues de un crash LoadProhibited en i2s_write. El
; propio commit trataba a la PSRAM como "sospechosa", no como la causa.
; LA CAUSA NUNCA SE AISLO. Antes habia aca dos comentarios que culpaban a cosas
; distintas (memory_type aca, el DMA en PSRAM abajo); el del DMA NO APLICA a
; este toolchain: en IDF 4.4 el driver I2S pide sus buffers con MALLOC_CAP_DMA y
; nunca caen en PSRAM. Diagnostico propuesto antes de reactivarla: E1' en
; docs/informe-mejora-2026-09-22.md §3.1. Corregido 2026-10-05. ---
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.filesystem = spiffs
board_build.partitions = partition.csv

extra_scripts = pre:scripts/hermes_server_ip.py

upload_protocol = esptool
upload_flags = --no-stub
monitor_filters =
  esp32_exception_decoder
  time
build_unflags = -std=gnu++11

build_flags =
    -std=gnu++17
    -D CORE_DEBUG_LEVEL=5
    -D DEBUG_ESP_PORT=Serial
    -D TOUCH_SENSOR_ENABLE=1        ; Enable touch sensor driver
    ; BOARD_HAS_PSRAM NO se define a proposito: la PSRAM (2 MB) queda apagada.
    ; El por que, y por que la causa del crash sigue abierta, esta en el
    ; comentario de la seccion "Flash del FH4R2", mas arriba.
    -D ARDUINO_USB_MODE=1          ; native USB (the Zero has no UART bridge)
    -D ARDUINO_USB_CDC_ON_BOOT=1   ; expose Serial over USB-C for the monitor
